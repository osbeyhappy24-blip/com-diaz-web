<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Test Auth</title>
<style>
body{background:#0b0f1a;color:#e5e7eb;font-family:monospace;padding:20px}
pre{background:#151b2b;padding:15px;border-radius:10px;border:1px solid #243049}
.ok{color:#10b981}
.err{color:#ef4444}
</style>
</head>
<body>
<h1>🧪 Test de Auth</h1>
<pre id="out">Ejecutando…</pre>
<script>
const out = document.getElementById('out');
const log = (msg, cls) => out.innerHTML += '\n<span class="' + (cls||'') + '">' + msg + '</span>';

const KEY = localStorage.getItem('comdiaz_api_key') || '1234';
log('Clave guardada: ' + (localStorage.getItem('comdiaz_api_key') || 'NULL'));
log('Clave usada: ' + KEY);
log('');

// Test 1: auth
fetch('https://com-diaz.onrender.com/api/auth', {
  method: 'POST',
  headers: {'Content-Type':'application/json'},
  body: JSON.stringify({key: '1234'})
}).then(r => r.json()).then(d => {
  log('Test 1 (auth): ' + JSON.stringify(d), d.ok ? 'ok' : 'err');
  // Test 2: state con clave
  return fetch('https://com-diaz.onrender.com/api/state', {
    headers: {'X-Comdiaz-Key': '1234'}
  });
}).then(r => r.json()).then(d => {
  const ok = d.results || d.categories;
  log('Test 2 (state): ' + (ok ? 'OK · ' + (d.results?.length || 0) + ' productos, ' + (d.categories?.length || 0) + ' categorías' : JSON.stringify(d).slice(0,100)), ok ? 'ok' : 'err');
  // Test 3: sin clave
  return fetch('https://com-diaz.onrender.com/api/state');
}).then(r => r.json()).then(d => {
  log('Test 3 (sin clave): ' + JSON.stringify(d).slice(0, 100), d.ok ? 'err' : 'ok');
  log('');
  log('✅ Si los 3 tests están arriba, el backend está perfecto.');
}).catch(e => {
  log('ERROR: ' + e.message, 'err');
});
</script>
</body>
</html>
