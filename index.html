<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comdiaz</title>
<link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="welcome-body">
  <div class="welcome-wrap">
    <div class="logo-badge">C</div>
    <h1 class="logo-text">Comdiaz</h1>
    <p class="tagline">Automatización de compras</p>

    <div id="loaderBlock" class="loader"><span></span></div>
    <p id="welcomeHint" class="welcome-hint">Iniciando motor…</p>

    <div id="pinBlock" class="pin-block hidden">
      <div id="pinDots" class="pin-dots">
        <span></span><span></span><span></span><span></span>
      </div>
      <div id="pinPad" class="pin-pad"></div>
      <p id="pinError" class="pin-error"></p>
    </div>
  </div>
  <script src="welcome.js"></script>
</body>
</html>
