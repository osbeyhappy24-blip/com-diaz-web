
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi panel · Comdiaz Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon-shop.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #0b0f1a;
  color: #e5e7eb;
  min-height: 100vh;
  padding-bottom: 80px;
}

.header {
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  padding: 20px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header h1 { font-size: 18px; }
.header p { font-size: 12px; opacity: 0.9; margin-top: 2px; }
.logout-btn {
  background: rgba(0,0,0,.3);
  border: none;
  color: #fff;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 16px;
}

/* Card de info del vendedor */
.info-card {
  background: rgba(255,255,255,.03);
  border: 1px solid #243049;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
}
.info-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 13px;
}
.info-row .label { color: #94a3b8; }
.info-row .value { color: #e5e7eb; font-weight: 600; }

/* Cuota */
.quota-bar {
  height: 10px;
  background: #111827;
  border-radius: 999px;
  overflow: hidden;
  margin-top: 12px;
}
.quota-fill {
  height: 100%;
  background: linear-gradient(90deg, #10b981, #34d399);
  transition: width .5s;
  border-radius: 999px;
}
.quota-fill.warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.quota-fill.full { background: linear-gradient(90deg, #ef4444, #f87171); }

.quota-text {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-top: 6px;
  color: #94a3b8;
}

/* Badge estado */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .3px;
}
.badge.aprobado { background: rgba(16,185,129,.2); color: #34d399; }
.badge.pendiente { background: rgba(245,158,11,.2); color: #fbbf24; }
.badge.suspendido { background: rgba(239,68,68,.2); color: #f87171; }
.badge.publicado { background: rgba(124,58,237,.2); color: #a78bfa; }
.badge.oculto { background: rgba(148,163,184,.2); color: #94a3b8; }

/* Botón añadir producto */
.add-btn {
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  color: #fff;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  margin-bottom: 16px;
  transition: transform .15s;
}
.add-btn:active { transform: scale(.98); }
.add-btn:disabled { opacity: .5; cursor: not-allowed; }

/* Lista de productos */
.products-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.product-item {
  display: flex;
  gap: 12px;
  background: rgba(255,255,255,.03);
  border: 1px solid #243049;
  border-radius: 12px;
  padding: 10px;
}
.product-img {
  width: 70px;
  height: 70px;
  border-radius: 8px;
  object-fit: cover;
  background: #111827;
  flex-shrink: 0;
}
.product-body {
  flex: 1;
  min-width: 0;
}
.product-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.product-price {
  font-size: 14px;
  font-weight: 800;
  color: #10b981;
  margin-bottom: 4px;
}
.product-meta {
  font-size: 11px;
  color: #94a3b8;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.product-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.product-actions button {
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid #243049;
  background: transparent;
  color: #e5e7eb;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.product-actions .btn-edit { color: #a78bfa; border-color: rgba(167,139,250,.3); }
.product-actions .btn-del { color: #f87171; border-color: rgba(248,113,113,.3); }

.empty {
  text-align: center;
  padding: 40px 20px;
  color: #64748b;
  font-size: 14px;
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal.hidden { display: none; }
.modal-card {
  background: #0f1524;
  border-radius: 16px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid #243049;
}
.modal-head {
  padding: 16px;
  border-bottom: 1px solid #243049;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-head h3 { font-size: 16px; }
.modal-close {
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 22px;
  cursor: pointer;
}
.modal-body { padding: 16px; }

label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 6px;
  margin-top: 12px;
}
label:first-child { margin-top: 0; }
input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid #243049;
  background: #111827;
  color: #e5e7eb;
  font-size: 14px;
  font-family: inherit;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: #7c3aed; }
textarea { min-height: 60px; resize: vertical; }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn-save {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 16px;
}
.btn-save:disabled { opacity: .6; }

.error {
  background: rgba(239,68,68,.15);
  border: 1px solid rgba(239,68,68,.3);
  color: #f87171;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
  margin-top: 12px;
  display: none;
}
.error.show { display: block; }

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  border: 1px solid #374151;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  z-index: 2000;
  display: none;
}
.toast.show { display: block; }
.toast.ok { border-color: #10b981; }
.toast.err { border-color: #ef4444; }

/* ═══ Notificaciones modernas ═══ */
.notif-bell {
  position: relative;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #1e293b;
  border: 1.5px solid #334155;
  color: #f1f5f9;
  font-size: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .2s;
  padding: 0;
}
.notif-bell:hover { background: #334155; transform: scale(1.06); }
.notif-bell.pulse { animation: pulseBell 1.8s ease-in-out infinite; }
@keyframes pulseBell {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
  50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
}
.notif-badge {
  position: absolute;
  top: -3px; right: -3px;
  background: #ef4444;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 5px;
  border-radius: 10px;
  min-width: 16px;
  text-align: center;
  display: none;
  border: 1.5px solid #0f172a;
}
.notif-badge.show { display: block; }

.notif-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 998;
  display: none;
  backdrop-filter: blur(2px);
}
.notif-overlay.show { display: block; }

.notif-panel {
  position: fixed;
  top: 70px;
  right: 12px;
  width: calc(100% - 24px);
  max-width: 380px;
  max-height: 70vh;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 16px;
  z-index: 999;
  box-shadow: 0 20px 60px rgba(0,0,0,.7);
  display: none;
  flex-direction: column;
  overflow: hidden;
  transform: translateY(-8px);
  opacity: 0;
  transition: all .25s ease;
}
.notif-panel.show { display: flex; transform: translateY(0); opacity: 1; }

.notif-header {
  padding: 14px 16px;
  border-bottom: 1px solid #1e293b;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0b1220;
}
.notif-header h3 { margin: 0; font-size: 15px; color: #f1f5f9; font-weight: 700; }
.notif-header button {
  background: transparent;
  border: none;
  color: #3b82f6;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 6px;
}
.notif-header button:hover { background: rgba(59,130,246,.1); }

.notif-list {
  overflow-y: auto;
  flex: 1;
  max-height: 60vh;
}

.notif-item {
  padding: 12px 40px 12px 52px;
  border-bottom: 1px solid #1e293b;
  cursor: pointer;
  transition: background .15s, transform .25s;
  position: relative;
  overflow: hidden;
}
.notif-item:hover { background: #1e293b; }
.notif-item.no-leida { background: rgba(59,130,246,.06); }
.notif-item.no-leida::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: #3b82f6;
}
.notif-icon {
  position: absolute;
  left: 14px; top: 14px;
  font-size: 22px;
  line-height: 1;
}
.notif-titulo {
  font-weight: 700;
  font-size: 13px;
  color: #f1f5f9;
  margin-bottom: 4px;
}
.notif-mensaje {
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.4;
  margin-bottom: 6px;
}
.notif-fecha {
  font-size: 10px;
  color: #64748b;
  font-weight: 500;
}
.notif-dismiss {
  position: absolute;
  top: 10px; right: 10px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(0,0,0,.4);
  border: none;
  color: #94a3b8;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .15s;
}
.notif-item:hover .notif-dismiss, .notif-item:active .notif-dismiss { opacity: 1; }
.notif-dismiss:hover { background: #ef4444; color: #fff; }

.notif-empty {
  padding: 48px 24px;
  text-align: center;
  color: #64748b;
  font-size: 13px;
}
.notif-empty-icon { font-size: 40px; margin-bottom: 10px; opacity: .7; }

/* Toast moderno */
.notif-toast-container {
  position: fixed;
  top: 12px; left: 12px; right: 12px;
  z-index: 10000;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.notif-toast {
  background: linear-gradient(135deg, #1e40af, #1e3a8a);
  border: 1px solid #3b82f6;
  border-radius: 14px;
  padding: 12px 14px;
  color: #fff;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  pointer-events: auto;
  cursor: pointer;
  animation: slideDown .35s cubic-bezier(.34,1.56,.64,1);
  max-width: 100%;
}
.notif-toast.success {
  background: linear-gradient(135deg, #166534, #14532d);
  border-color: #22c55e;
}
.notif-toast.error {
  background: linear-gradient(135deg, #991b1b, #7f1d1d);
  border-color: #ef4444;
}
.notif-toast-icon { font-size: 22px; flex-shrink: 0; }
.notif-toast-body { flex: 1; min-width: 0; }
.notif-toast-titulo { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.notif-toast-mensaje { font-size: 11px; opacity: .92; line-height: 1.3; }
@keyframes slideDown {
  from { transform: translateY(-120%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120%); opacity: 0; }
}
.notif-toast.dismissing { animation: slideUp .25s ease forwards; }

.notif-item.swipe-out {
  transition: transform .3s ease, opacity .3s ease;
  transform: translateX(120%);
  opacity: 0;
}

</style>
<style>
/* ── Photo uploader ── */
.photo-upload { margin: 8px 0 16px; }
.photo-empty {
  border: 2px dashed #334155; border-radius: 12px; padding: 24px 12px;
  text-align: center; cursor: pointer; transition: all .2s; background: #0b1220;
}
.photo-empty:hover { border-color: #3b82f6; background: #0f1a2e; }
.photo-icon { font-size: 32px; margin-bottom: 6px; }
.photo-text { font-size: 14px; color: #94a3b8; font-weight: 600; }
.photo-hint { font-size: 11px; color: #64748b; margin-top: 4px; }
.photo-preview-wrap { position: relative; border-radius: 12px; overflow: hidden; background: #0b1220; }
.photo-preview { width: 100%; max-height: 320px; object-fit: contain; display: block; }
.photo-remove {
  position: absolute; top: 8px; right: 8px; width: 32px; height: 32px;
  border-radius: 50%; border: none; background: rgba(0,0,0,.75); color: #fff;
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.photo-remove:hover { background: #ef4444; }
.photo-status {
  position: absolute; bottom: 8px; left: 8px; right: 8px;
  font-size: 12px; padding: 6px 10px; border-radius: 8px;
  background: rgba(0,0,0,.8); color: #fff; text-align: center;
}
.photo-status.uploading { background: rgba(59,130,246,.9); }
.photo-status.ok { background: rgba(34,197,94,.9); }
.photo-status.err { background: rgba(239,68,68,.9); }
.hidden { display: none !important; }
.retry-btn {
  margin-top: 12px; padding: 8px 16px; background: #3b82f6; color: #fff;
  border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
}
</style>

<script>
window.addEventListener('error', e => {
  alert('ERROR JS: ' + e.message + ' en ' + e.filename + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', e => {
  alert('PROMESA RECHAZADA: ' + e.reason);
});
console.log = (...args) => { document.title = 'LOG: ' + args.join(' ').slice(0,100); };
</script>
</head>
<body>

<div class="header">
  <div>
    <h1>Mi panel</h1>
    <p id="sellerName">Cargando...</p>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
      <button class="notif-bell" id="notifBell" onclick="toggleNotifPanel()" aria-label="Notificaciones">
        🔔
        <span class="notif-badge" id="notifBadge">0</span>
      </button>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
</div>

<div class="container">

  <!-- Info del vendedor -->
  <div class="info-card">
    <div class="info-row">
      <span class="label">Estado</span>
      <span class="value" id="sellerEstado">—</span>
    </div>
    <div class="info-row">
      <span class="label">Plan</span>
      <span class="value" id="sellerPlan">—</span>
    </div>
    <div class="info-row">
      <span class="label">Teléfono</span>
      <span class="value" id="sellerTelefono">—</span>
    </div>

    <div class="quota-bar">
      <div class="quota-fill" id="quotaFill" style="width:0%"></div>
    </div>
    <div class="quota-text">
      <span id="quotaUsada">0 productos</span>
      <span id="quotaMax">—</span>
    </div>
  </div>

  <!-- Botón añadir -->
  <button class="add-btn" id="addProductBtn" onclick="document.getElementById('photoInput').click()">➕ Añadir productos (fotos)</button>

  <!-- Lista de productos -->
  <div class="products-list" id="productsList">
    <div class="empty">Cargando productos...</div>
  </div>

</div>

<!-- Modal nuevo/editar producto -->
<div class="modal hidden" id="productModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">Nuevo producto</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body">
      <label>Título *</label>
      <input type="text" id="prodTitulo" maxlength="200" placeholder="Ej: Bicicleta rodado 26">

      <label>Descripción</label>
      <textarea id="prodDescripcion" maxlength="2000" placeholder="Detalles del producto..."></textarea>

      <div class="row-2">
        <div>
          <label>Precio USD *</label>
          <input type="number" id="prodPrecioUSD" step="0.01" min="0" placeholder="0.00">
        </div>
        <div>
          <label>Precio CUP</label>
          <input type="number" id="prodPrecioCUP" step="1" min="0" placeholder="0">
        </div>
      </div>

      <label>Categoría</label>
      <input type="text" id="prodCategoria" maxlength="80" placeholder="Ej: Motos y Bicicletas">

      <div class="row-2">
        <div>
          <label>Provincia</label>
          <input type="text" id="prodProvincia" maxlength="60">
        </div>
        <div>
          <label>Municipio</label>
          <input type="text" id="prodMunicipio" maxlength="60">
        </div>
      </div>

      <div class="row-2">
        <div>
          <label>Estado</label>
          <select id="prodEstado">
            <option value="nuevo">Nuevo</option>
            <option value="usado">Usado</option>
            <option value="reacondicionado">Reacondicionado</option>
          </select>
        </div>
        <div>
          <label>Stock</label>
          <input type="number" id="prodStock" min="1" value="1">
        </div>
      </div>

      <label>📷 Foto del producto</label>
      <div class="photo-upload">
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handleMultiplePhotos(event)">
        <div class="photo-empty" id="photoEmpty" onclick="document.getElementById('photoInput').click()">
          <div class="photo-icon">📷</div>
          <div class="photo-text">Toca para añadir foto</div>
          <div class="photo-hint">JPG/PNG · se comprime automáticamente</div>
        </div>
        <div class="photo-preview-wrap hidden" id="photoPreviewWrap">
          <img id="photoPreview" class="photo-preview" alt="">
          <button type="button" class="photo-remove" onclick="quitarFoto()">✕</button>
          <div class="photo-status" id="photoStatus"></div>
        </div>
      </div>

      <div id="modalError" class="error"></div>

      <button class="btn-save" id="btnSave" onclick="guardarProductoEnLote()">💾 Guardar y siguiente</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:3000'
  : 'https://com-diaz.onrender.com';

const TOKEN = localStorage.getItem('comdiaz_seller_token');
if (!TOKEN) {
  location.href = 'seller.html';
}

let sellerData = null;
let productos = [];
let editingId = null;

function toast(msg, tipo = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + tipo;
  setTimeout(() => t.className = 'toast ' + tipo, 2500);
}

async function cargarPerfil() {
  const list = document.getElementById('productsList');
  try {
    // Pre-warm Render (cold start) — no bloquea si falla
    try { await fetch(API + '/api/health', { method: 'GET' }); } catch(_) {}

    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 20000);
    const r = await fetch(API + '/api/seller/me', {
      headers: { 'Authorization': 'Bearer ' + TOKEN },
      signal: ctrl.signal
    });
    clearTimeout(to);

    const d = await r.json();
    if (!d.ok) {
      if (r.status === 401) { logout(); return; }
      if (list) list.innerHTML = '<div class="empty" style="color:#f87171">Error: ' + (d.error||'desconocido') + '<br><button class="retry-btn" onclick="cargarPerfil()">\uD83D\uDD04 Reintentar</button></div>';
      toast('Error: ' + d.error, 'err');
      return;
    }
    sellerData = d.seller;
    renderPerfil();
    cargarProductos();
  } catch(e) {
    let msg = 'Sin conexion o timeout.';
    if (e && e.name === 'AbortError') msg = 'Timeout (20s). Servidor lento o dormido.';
    else if (e && e.message) msg = 'Error: ' + e.message;
    // Si el token está vacio o corrupto
    if (!TOKEN || TOKEN.length < 20) msg = 'Sesion invalida. Vuelve a iniciar sesion.';
    console.error('[PANEL] cargarPerfil error:', e);
    if (list) list.innerHTML = '<div class="empty" style="color:#f87171">' + msg +
      '<br><button class="retry-btn" onclick="cargarPerfil()">\uD83D\uDD04 Reintentar</button>' +
      '<br><button class="retry-btn" style="background:#6b7280;margin-top:8px" onclick="logout()">\uD83D\uDEAA Salir y reloguear</button></div>';
    toast(msg, 'err');
  }
}

async function cargarProductos() {
  const list = document.getElementById('productsList');
  if (!list) return;
  if (!productos.length) list.innerHTML = '<div class="empty">Cargando productos\u2026</div>';

  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 20000);
    const r = await fetch(API + '/api/seller/products', {
      headers: { 'Authorization': 'Bearer ' + TOKEN },
      signal: ctrl.signal
    });
    clearTimeout(to);
    const d = await r.json();
    if (!d.ok) {
      if (r.status === 401) { logout(); return; }
      list.innerHTML = '<div class="empty" style="color:#f87171">Error: ' + (d.error||'desconocido') + '<br><button class="retry-btn" onclick="cargarProductos()">\uD83D\uDD04 Reintentar</button></div>';
      return;
    }
    productos = d.products || [];
    renderProductos();
  } catch(e) {
    list.innerHTML = '<div class="empty" style="color:#f87171">No se pudo cargar.<br><button class="retry-btn" onclick="cargarProductos()">\uD83D\uDD04 Reintentar</button></div>';

}

  const body = {
    titulo: document.getElementById('prodTitulo').value.trim(),
    descripcion: document.getElementById('prodDescripcion').value.trim(),

    estado_producto: document.getElementById('prodEstado').value,

  };

  if (!body.titulo || body.titulo.length < 3) {
    err.textContent = 'Título mínimo 3 caracteres';
    err.classList.add('show');
    return;
  }
  if (!body.precio_usd || body.precio_usd <= 0) {
    err.textContent = 'Precio USD requerido';
    err.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    const url = editingId
      ? API + '/api/seller/products/' + editingId
      : API + '/api/seller/products';
    // Adjuntar imagen si existe
    body.imagenes = imagenActual ? [imagenActual] : [];

    const method = editingId ? 'PUT' : 'POST';
    const r = await fetch(url, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + TOKEN
      },
      body: JSON.stringify(body)
    });
    const d = await r.json();

    if (d.ok) {
      toast(editingId ? '✅ Producto actualizado' : '✅ Producto creado', 'ok');
      cerrarModal();
      cargarPerfil();
    } else {
      err.textContent = d.error || 'Error al guardar';
      err.classList.add('show');

  } catch(e) {
    err.textContent = 'Error: ' + e.message;
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Guardar';
  }

// HELPERS DE FOTO (comprimir, base64, preview, quitar)
// ═══════════════════════════════════════════════════════
function comprimirImagen(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const ratio = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('compresión falló')),
                    'image/jpeg', quality || 0.82);
    };
    img.onerror = () => reject(new Error('no se pudo cargar la imagen'));
    img.src = URL.createObjectURL(file);
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('lectura falló'));
    r.readAsDataURL(blob);
  });
}

// CARGA MASIVA DE PRODUCTOS (1 foto = 1 producto)
// ═══════════════════════════════════════════════════════
let colaProductos = [];      // Array de { blob, url, datos: {} }
let indiceCola = 0;         // Índice del producto actual en el asistente

function resetBulkState() {
  colaProductos = [];
  indiceCola = 0;
  const bulkStatus = document.getElementById('bulkStatus');
  if (bulkStatus) bulkStatus.textContent = '';
}

async function handleMultiplePhotos(event) {
  const files = Array.from(event.target.files);
  if (files.length === 0) return;

  resetBulkState();
  const statusEl = document.getElementById('photoStatus');
  if (!statusEl) return;

  // 0. Pre-validar sesión (evita fallar a mitad de carga)
  statusEl.textContent = 'Validando sesion...';
  try {
    const chk = await fetch(API + '/api/seller/me', {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    if (!chk.ok) {
      if (chk.status === 401) {
        toast('Sesion expirada. Vuelve a iniciar sesion.', 'err');
        setTimeout(() => logout(), 1500);
        return;
      }
      throw new Error('status ' + chk.status);
    }
  } catch(e) {
    toast('Sin conexion. Reintenta.', 'err');
    statusEl.textContent = '';
    return;
  }

  // 1. Comprimir todas (secuencial, con progreso)
  for (let i = 0; i < files.length; i++) {
    statusEl.textContent = `Comprimiendo ${i + 1} de ${files.length}...`;
    try {
      const compressedBlob = await comprimirImagen(files[i], 1200, 0.82);
      colaProductos.push({ blob: compressedBlob, url: null, datos: {} });
    } catch (err) {
      console.error('Error comprimiendo:', files[i].name, err);
    }
  }
  
  if (colaProductos.length === 0) {
    statusEl.textContent = 'No se pudo comprimir ninguna foto.';
    return;
  }

  // 2. Subir TODAS las fotos con delay 2.5s + retry 429
  //    (garantiza no pegar rate limit 30/min)
  for (let i = 0; i < colaProductos.length; i++) {
    const prod = colaProductos[i];
    if (prod.url) continue;

    // Delay entre uploads (excepto primero)
    if (i > 0) await new Promise(r => setTimeout(r, 2500));

    statusEl.textContent = `Subiendo foto ${i + 1} de ${colaProductos.length}...`;
    
    let exito = false;
    for (let intento = 0; intento < 3 && !exito; intento++) {
      try {
        const b64 = await blobToBase64(prod.blob);
        const r = await fetch(API + '/api/upload-image', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + TOKEN
          },
          body: JSON.stringify({ image: b64, nombre: 'seller_' + Date.now() + '.jpg' })
        });

        if (r.status === 401) {
          toast('Sesion expirada. Vuelve a iniciar sesion.', 'err');
          setTimeout(() => logout(), 1500);
          return;
        }
        if (r.status === 429) {
          statusEl.textContent = `Limite alcanzado. Esperando 60s... (${i + 1}/${colaProductos.length})`;
          await new Promise(r => setTimeout(r, 60000));
          continue;
        }
        const d = await r.json();
        if (d.ok && d.url) {
          prod.url = d.url;
          exito = true;
        } else {
          throw new Error(d.error || 'fallo upload');
        }
      } catch(e) {
        if (intento < 2) {
          statusEl.textContent = `Error foto ${i + 1}. Reintento ${intento + 1}/3...`;
          await new Promise(r => setTimeout(r, 3000));
        }
      }
    }
    if (!exito) {
      statusEl.textContent = `Fallo definitivo en foto ${i + 1}. Continuando con las demas...`;
    }
  }

  // 3. Todas subidas → iniciar formularios
  const subidas = colaProductos.filter(p => p.url).length;
  statusEl.textContent = `✅ ${subidas}/${colaProductos.length} fotos subidas. Iniciando formularios...`;
  
  if (subidas > 0) {
    // Filtrar las que fallaron
    colaProductos = colaProductos.filter(p => p.url);
    indiceCola = 0;
    abrirFormularioSiguiente();
  } else {
    toast('Ninguna foto se pudo subir. Reintenta.', 'err');
  }
}

function abrirFormularioSiguiente() {
  if (indiceCola >= colaProductos.length) {
    // Asistente terminado
    toast(`✅ ${colaProductos.length} productos creados.`, 'ok');
    cerrarModal();
    cargarPerfil(); // Recargar la lista de productos
    return;
  }

  const producto = colaProductos[indiceCola];
  
  // Rellenar el modal con los datos del producto actual
  document.getElementById('modalTitle').textContent = `Nuevo producto ${indiceCola + 1} de ${colaProductos.length}`;
  document.getElementById('prodTitulo').value = producto.datos.titulo || '';
  document.getElementById('prodPrecioUSD').value = producto.datos.precio_usd || '';
  // ... (resetear otros campos del formulario)
  
  // Mostrar la vista previa de la imagen actual
  if (producto.url) {
    mostrarFotoPreview(producto.url, 'ok', '✓ Foto lista');
  } else {
    mostrarFotoPreview(URL.createObjectURL(producto.blob), 'uploading', 'Subiendo...');
    subirFotoLote(producto); // Subir la foto en segundo plano
  }
  
  document.getElementById('productModal').classList.remove('hidden');
}

async function subirFotoLote(producto) {
  try {
    const b64 = await blobToBase64(producto.blob);
    const r = await fetch(API + '/api/upload-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
      body: JSON.stringify({ image: b64, nombre: 'seller_' + Date.now() + '.jpg' })
    });
    const d = await r.json();
    if (d.ok && d.url) {
      producto.url = d.url;
      mostrarFotoPreview(d.url, 'ok', '✓ Foto lista');
    } else {
      mostrarFotoPreview(URL.createObjectURL(producto.blob), 'err', 'Error al subir');
    }
  } catch (e) {
    mostrarFotoPreview(URL.createObjectURL(producto.blob), 'err', 'Sin conexión');
  }
}

// Modificar guardarProducto para que maneje la cola
async function guardarProductoEnLote() {
  const producto = colaProductos[indiceCola];
  if (!producto) return;

  // Recoger datos del formulario actual
  producto.datos = {
    titulo: document.getElementById('prodTitulo').value.trim(),
    descripcion: document.getElementById('prodDescripcion').value.trim(),
    precio_usd: parseFloat(document.getElementById('prodPrecioUSD').value),
    precio_cup: parseFloat(document.getElementById('prodPrecioCUP').value) || null,
    categoria: document.getElementById('prodCategoria').value.trim(),
    provincia: document.getElementById('prodProvincia').value.trim(),
    municipio: document.getElementById('prodMunicipio').value.trim(),
    estado_producto: document.getElementById('prodEstado').value,
    stock: parseInt(document.getElementById('prodStock').value) || 1,
    imagenes: producto.url ? [producto.url] : [] // Solo la URL subida
  };

  // Validación básica
  if (producto.datos.titulo.length < 3 || !producto.datos.precio_usd || producto.datos.precio_usd <= 0) {
    document.getElementById('modalError').textContent = 'Título y precio USD son obligatorios.';
    document.getElementById('modalError').classList.add('show');
    return;
  }

  // Enviar al backend
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  
  try {
    const r = await fetch(API + '/api/seller/products', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
      body: JSON.stringify(producto.datos)
    });
    const d = await r.json();
    if (d.ok) {
      indiceCola++;
      document.getElementById('modalError').classList.remove('show');
      abrirFormularioSiguiente(); // Pasar al siguiente
    } else {
      throw new Error(d.error || 'Error del servidor');
    }
  } catch (e) {
    document.getElementById('modalError').textContent = 'Error: ' + e.message;
    document.getElementById('modalError').classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Guardar y siguiente';
  }
}

function guardarCuotaCache(seller) {

      max: seller.cuota_max || 50,

}
function leerCuotaCache() {

  } catch(_) { return null; }
}

// ═══════════════════════════════════════════════════════
// Fix CARGANDO colgado — fetch con timeout + retry + fallback
// ═══════════════════════════════════════════════════════
async function fetchConTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms || 15000);
  try {
    const r = await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
    clearTimeout(t);
    return r;
  } catch(e) {
    clearTimeout(t);
    throw e;
  }
}

    if (u) u.textContent = c.usada + ' productos (offline)';
    if (m) m.textContent = c.max === -1 ? '∞' : c.max + ' máx';
  }
});

console.log('✅ Photo uploader + quota cache ready');

</script>


<!-- Overlay + Panel de notificaciones -->
<div class="notif-overlay" id="notifOverlay" onclick="closeNotifPanel()"></div>
<div class="notif-panel" id="notifPanel" role="dialog" aria-label="Notificaciones">
  <div class="notif-header">
    <h3>Notificaciones</h3>
    <button onclick="marcarTodasLeidas()">Marcar todas ✓</button>
  </div>
  <div class="notif-list" id="notifList">
    <div class="notif-empty">
      <div class="notif-empty-icon">🔔</div>
      Cargando...
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="notif-toast-container" id="notifToastContainer"></div>


<script>
// ═══════════════════════════════════════════════════════
// Notificaciones in-app modernas (v2)
// ═══════════════════════════════════════════════════════
(function(){
  const ICONS = {
    aprobado: '✅',
    suspendido: '🚫',
    plan_por_vencer: '⏰',
    plan_caducado: '⚠️',
    info: '🔔'
  };

  let _timer = null;
  let _lastCount = -1;
  let _notifsCache = [];

  function esc(s) {
    return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  }

  function tiempoRelativo(iso) {
    try {
      const d = new Date(iso);
      const diff = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diff < 0) return 'ahora';
      if (diff < 60) return 'hace ' + diff + 's';
      if (diff < 3600) return 'hace ' + Math.floor(diff/60) + ' min';
      if (diff < 86400) return 'hace ' + Math.floor(diff/3600) + ' h';
      if (diff < 172800) return 'ayer';
      if (diff < 604800) return 'hace ' + Math.floor(diff/86400) + ' d';
      return d.toLocaleDateString('es', { day: 'numeric', month: 'short' });
    } catch(_) { return ''; }
  }

  function mostrarToast(titulo, mensaje, tipo) {
    const cont = document.getElementById('notifToastContainer');
    if (!cont) return;
    const cls = tipo === 'aprobado' ? 'success' : (tipo === 'suspendido' || tipo === 'plan_caducado') ? 'error' : '';
    const icon = ICONS[tipo] || '🔔';
    const el = document.createElement('div');
    el.className = 'notif-toast ' + cls;
    el.innerHTML =
      '<div class="notif-toast-icon">' + icon + '</div>' +
      '<div class="notif-toast-body">' +
        '<div class="notif-toast-titulo">' + esc(titulo) + '</div>' +
        (mensaje ? '<div class="notif-toast-mensaje">' + esc(mensaje) + '</div>' : '') +
      '</div>';
    el.onclick = () => { closeNotifPanel(); toggleNotifPanel(); dismissToast(el); };
    cont.appendChild(el);
    setTimeout(() => dismissToast(el), 6000);
  }

  function dismissToast(el) {
    if (!el || !el.parentNode) return;
    el.classList.add('dismissing');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 250);
  }

  async function cargarNotificaciones(mostrarToastNuevas) {
    if (typeof TOKEN === 'undefined' || !TOKEN) return;
    try {
      const r = await fetch(API + '/api/seller/notifications', {
        headers: { 'Authorization': 'Bearer ' + TOKEN }
      });
      const d = await r.json();
      if (!d.ok) return;
      const notifs = d.notifications || [];
      _notifsCache = notifs;
      renderNotificaciones(notifs);

      const noLeidas = notifs.filter(n => !n.leida).length;
      const badge = document.getElementById('notifBadge');
      const bell = document.getElementById('notifBell');
      if (badge) {
        badge.textContent = noLeidas > 99 ? '99+' : noLeidas;
        badge.classList.toggle('show', noLeidas > 0);
      }
      if (bell) bell.classList.toggle('pulse', noLeidas > 0);

      // Toast si hay nuevas (no en la primera carga)
      if (mostrarToastNuevas && _lastCount >= 0 && noLeidas > _lastCount) {
        const nuevas = notifs.filter(n => !n.leida).slice(0, Math.min(noLeidas - _lastCount, 3));
        nuevas.forEach((n, i) => {
          setTimeout(() => mostrarToast(n.titulo, n.mensaje, n.tipo), i * 400);
        });
      }
      _lastCount = noLeidas;
    } catch(_) {}
  }

  function renderNotificaciones(notifs) {
    const list = document.getElementById('notifList');
    if (!list) return;
    if (!notifs.length) {
      list.innerHTML =
        '<div class="notif-empty">' +
          '<div class="notif-empty-icon">✨</div>' +
          'Todo al día<br><span style="font-size:11px;opacity:.7">No tienes notificaciones</span>' +
        '</div>';
      return;
    }
    list.innerHTML = notifs.map(n => {
      const icon = ICONS[n.tipo] || '🔔';
      return (
        '<div class="notif-item ' + (n.leida ? 'leida' : 'no-leida') + '" data-id="' + esc(n.id) + '">' +
          '<div class="notif-icon">' + icon + '</div>' +
          '<button class="notif-dismiss" data-dismiss="' + esc(n.id) + '" aria-label="Descartar">✕</button>' +
          '<div class="notif-titulo">' + esc(n.titulo) + '</div>' +
          (n.mensaje ? '<div class="notif-mensaje">' + esc(n.mensaje) + '</div>' : '') +
          '<div class="notif-fecha">' + tiempoRelativo(n.created_at) + '</div>' +
        '</div>'
      );
    }).join('');

    // Bind clicks
    list.querySelectorAll('.notif-item').forEach(el => {
      const id = el.dataset.id;
      el.onclick = async (ev) => {
        if (ev.target.classList.contains('notif-dismiss')) return;
        try {
          await fetch(API + '/api/seller/notifications/' + id + '/read', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + TOKEN }
          });
          el.classList.remove('no-leida');
          el.classList.add('leida');
          cargarNotificaciones(false);
        } catch(_) {}
      };

      // Swipe to dismiss
      let startX = 0, startY = 0, moved = false;
      el.addEventListener('touchstart', (ev) => {
        startX = ev.touches[0].clientX;
        startY = ev.touches[0].clientY;
        moved = false;
      }, { passive: true });
      el.addEventListener('touchmove', (ev) => {
        const dx = ev.touches[0].clientX - startX;
        const dy = ev.touches[0].clientY - startY;
        if (Math.abs(dx) > Math.abs(dy) && dx > 60) {
          moved = true;
          el.classList.add('swipe-out');
        }
      }, { passive: true });
      el.addEventListener('touchend', async () => {
        if (!moved) return;
        // Marcar como leída y quitar visualmente
        try {
          await fetch(API + '/api/seller/notifications/' + id + '/read', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + TOKEN }
          });
        } catch(_) {}
        setTimeout(() => cargarNotificaciones(false), 350);
      });
    });

    // Bind dismiss buttons
    list.querySelectorAll('.notif-dismiss').forEach(btn => {
      btn.onclick = async (ev) => {
        ev.stopPropagation();
        const id = btn.dataset.dismiss;
        const item = btn.closest('.notif-item');
        if (item) item.classList.add('swipe-out');
        try {
          await fetch(API + '/api/seller/notifications/' + id + '/read', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + TOKEN }
          });
        } catch(_) {}
        setTimeout(() => cargarNotificaciones(false), 350);
      };
    });
  }

  window.toggleNotifPanel = function() {
    const p = document.getElementById('notifPanel');
    const o = document.getElementById('notifOverlay');
    if (!p) return;
    const estaAbierto = p.classList.contains('show');
    if (estaAbierto) {
      closeNotifPanel();
    } else {
      p.classList.add('show');
      if (o) o.classList.add('show');
      cargarNotificaciones(false);
    }
  };

  window.closeNotifPanel = function() {
    const p = document.getElementById('notifPanel');
    const o = document.getElementById('notifOverlay');
    if (p) p.classList.remove('show');
    if (o) o.classList.remove('show');
  };

  window.marcarTodasLeidas = async function() {
    if (typeof TOKEN === 'undefined' || !TOKEN) return;
    try {
      await fetch(API + '/api/seller/notifications/read-all', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + TOKEN }
      });
      cargarNotificaciones(false);
    } catch(_) {}
  };

  // Init
  setTimeout(() => {
    cargarNotificaciones(false);
    _timer = setInterval(() => cargarNotificaciones(true), 60000);
  }, 2000);

  console.log('✅ Notificaciones modernas listas');
})();
</script>


<script>
// ═══════════════════════════════════════════════════════
// Suscripción Push (Web Push VAPID)
// ═══════════════════════════════════════════════════════
(function(){
  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async function registrarPushSeller() {
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (typeof TOKEN === 'undefined' || !TOKEN) return;

      // Registrar SW si no está
      let reg;
      try {
        reg = await navigator.serviceWorker.getRegistration('/service-worker.js');
        if (!reg) reg = await navigator.serviceWorker.register('/service-worker.js');
        await navigator.serviceWorker.ready;
      } catch(e) {
        console.warn('[PUSH] SW no registrado:', e.message);
        return;
      }

      // ¿Ya suscrito?
      let sub = await reg.pushManager.getSubscription();
      if (sub) {
        // Verificar que backend lo tenga
        try {
          await fetch(API + '/api/seller/push/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
            body: JSON.stringify({ subscription: sub })
          });
        } catch(_) {}
        return;
      }

      // Pedir permiso si no está dado
      if (Notification.permission === 'default') {
        // Pequeño delay para no spamear al entrar
        await new Promise(r => setTimeout(r, 3000));
        const permiso = await Notification.requestPermission();
        if (permiso !== 'granted') {
          console.log('[PUSH] Permiso rechazado por el usuario');
          return;
        }
      } else if (Notification.permission !== 'granted') {
        return;
      }

      // Obtener VAPID public key
      const r = await fetch(API + '/api/public/vapid-key');
      const d = await r.json();
      if (!d.ok || !d.publicKey) return;

      // Suscribir
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(d.publicKey)
      });

      // Guardar en backend
      const save = await fetch(API + '/api/seller/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
        body: JSON.stringify({ subscription: sub })
      });
      const saved = await save.json();
      if (saved.ok) console.log('✅ Push suscrito. Total subs:', saved.total);
    } catch(e) {
      console.warn('[PUSH] Error:', e.message);
    }
  }

  // Ejecutar cuando el panel esté cargado y TOKEN disponible
  setTimeout(registrarPushSeller, 4000);

  // Auto-abrir panel de notifs si llegamos con #notif
  if (location.hash === '#notif') {
    setTimeout(() => {
      if (typeof toggleNotifPanel === 'function') toggleNotifPanel();
      // Limpiar hash
      try { history.replaceState(null, '', location.pathname); } catch(_) {}
    }, 2500);
  }

  console.log('✅ Push subscription helper cargado');
})();
</script>
