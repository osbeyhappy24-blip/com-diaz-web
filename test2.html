<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Test Todos los Endpoints</title>
<style>
body{background:#0b0f1a;color:#e5e7eb;font-family:monospace;padding:20px;font-size:13px}
pre{background:#151b2b;padding:15px;border-radius:10px;border:1px solid #243049;white-space:pre-wrap}
.ok{color:#10b981}
.err{color:#ef4444}
.warn{color:#f59e0b}
</style>
</head>
<body>
<h1>🧪 Test Completo</h1>
<pre id="out">Iniciando…</pre>
<script>
const out = document.getElementById('out');
const log = (m, cls) => { out.innerHTML += '<span class="' + (cls||'') + '">\n' + m + '</span>'; };

const API = 'https://com-diaz.onrender.com';
const KEY = localStorage.getItem('comdiaz_api_key') || '1234';

log('🔑 Clave usada: ' + KEY, 'warn');

// Envolver fetch como lo hace home.js
const _fetch = window.fetch.bind(window);
window.fetch = function(input, init) {
  init = init || {};
  init.headers = init.headers || {};
  const k = localStorage.getItem('comdiaz_api_key');
  if (k) {
    if (init.headers instanceof Headers) init.headers.set('X-Comdiaz-Key', k);
    else if (typeof init.headers === 'object') init.headers['X-Comdiaz-Key'] = k;
  }
  return _fetch(input, init);
};
log('✓ fetch envuelto');

async function testEndpoints() {
  // Test A: /api/state
  log('\n📡 TEST A: /api/state');
  try {
    const r = await fetch(API + '/api/state');
    const d = await r.json();
    log('  status: ' + r.status, r.ok ? 'ok' : 'err');
    log('  categories: ' + (d.categories?.length || 0));
    log('  results: ' + (d.results?.length || 0));
    log('  margin: ' + d.margin);
    log('  pin: ' + d.pin);
  } catch(e) { log('  ❌ ' + e.message, 'err'); }

  // Test B: /api/sources
  log('\n📡 TEST B: /api/sources');
  try {
    const r = await fetch(API + '/api/sources');
    const d = await r.json();
    log('  status: ' + r.status, r.ok ? 'ok' : 'err');
    log('  sources: ' + (d.sources?.length || 0));
  } catch(e) { log('  ❌ ' + e.message, 'err'); }

  // Test C: /api/summaries
  log('\n📡 TEST C: /api/summaries');
  try {
    const r = await fetch(API + '/api/summaries');
    const d = await r.json();
    log('  status: ' + r.status, r.ok ? 'ok' : 'err');
    log('  total: ' + d.total);
  } catch(e) { log('  ❌ ' + e.message, 'err'); }

  // Test D: /api/summaries/latest
  log('\n📡 TEST D: /api/summaries/latest');
  try {
    const r = await fetch(API + '/api/summaries/latest');
    const d = await r.json();
    log('  status: ' + r.status, r.ok ? 'ok' : 'err');
  } catch(e) { log('  ❌ ' + e.message, 'err'); }

  // Test E: /api/pin/change (solo validar que existe)
  log('\n📡 TEST E: /api/automation/pause');
  try {
    const r = await fetch(API + '/api/automation/pause', {method:'POST'});
    const d = await r.json();
    log('  status: ' + r.status, r.ok ? 'ok' : 'err');
  } catch(e) { log('  ❌ ' + e.message, 'err'); }

  // Test F: /health
  log('\n📡 TEST F: /health');
  try {
    const r = await fetch(API + '/health');
    const d = await r.json();
    log('  status: ' + r.status, r.ok ? 'ok' : 'err');
    log('  data: ' + JSON.stringify(d));
  } catch(e) { log('  ❌ ' + e.message, 'err'); }

  log('\n✅ FIN DEL TEST');
  log('📋 Si TODOS dicen "ok", el backend está bien.');
  log('   Si alguno dice "err" o "❌", ESE es el endpoint que rompe home.js.');
}

testEndpoints();
</script>
</body>
</html>
