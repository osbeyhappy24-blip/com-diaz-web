<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Copiloto</title>
<style>
body { font-family: monospace; padding: 16px; background: #0b0f1a; color: #e5e7eb; }
button { padding: 14px 20px; font-size: 16px; background: #7c3aed; color: white; border: none; border-radius: 8px; width: 100%; margin-bottom: 12px; }
#log { background: #111827; padding: 12px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 60vh; overflow-y: auto; }
.ok { color: #10b981; font-weight: bold; }
.err { color: #ef4444; font-weight: bold; }
.info { color: #fbbf24; }
</style>
</head>
<body>
<h1>Test Copiloto</h1>
<button id="btn">🚀 Probar XHR</button>
<div id="log">Esperando...</div>

<script>
const log = document.getElementById('log');
const btn = document.getElementById('btn');
const API = 'https://com-diaz-ty2b.onrender.com';

function addLog(msg, cls = '') {
  const t = new Date().toLocaleTimeString();
  log.innerHTML += '\n[' + t + '] ' + (cls ? '<span class="' + cls + '">' + msg + '</span>' : msg);
  log.scrollTop = log.scrollHeight;
}

btn.addEventListener('click', () => {
  log.innerHTML = 'Iniciando test...';
  const t0 = Date.now();
  
  addLog('Enviando POST a /api/ai/copilot...', 'info');
  
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', API + '/api/ai/copilot', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('X-Comdiaz-Key', '960902');
    xhr.timeout = 90000;
    
    xhr.onload = function() {
      const dt = ((Date.now() - t0) / 1000).toFixed(1);
      addLog('✅ Status: ' + xhr.status + ' (' + dt + 's)', 'ok');
      try {
        const data = JSON.parse(xhr.responseText);
        addLog('OK: ' + (data.ok || false), data.ok ? 'ok' : 'err');
        addLog('Respuesta: ' + (data.respuesta || '(vacío)').slice(0, 200));
      } catch(e) {
        addLog('JSON error: ' + e.message, 'err');
        addLog('Raw: ' + xhr.responseText.slice(0, 300));
      }
    };
    
    xhr.onerror = function() {
      const dt = ((Date.now() - t0) / 1000).toFixed(1);
      addLog('❌ ERROR DE RED (' + dt + 's)', 'err');
      addLog('Status: ' + xhr.status);
      addLog('Esto significa: sin conexión o CORS bloqueado');
    };
    
    xhr.ontimeout = function() {
      addLog('❌ TIMEOUT (' + xhr.timeout/1000 + 's)', 'err');
      addLog('El servidor no respondió en 90 segundos');
    };
    
    xhr.onabort = function() {
      addLog('⚠️ Abortado', 'err');
    };
    
    addLog('Esperando respuesta...', 'info');
    xhr.send(JSON.stringify({ mensaje: 'di OK', historial: [] }));
    
  } catch(e) {
    addLog('❌ Excepción: ' + e.message, 'err');
  }
});
</script>
</body>
</html>
