<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda — ProfitToLife Marketplace</title>
<link rel="stylesheet" href="brand-ptl.css">
<meta name="theme-color" content="#22C55E">
<link rel="icon" type="image/svg+xml" href="icon-ptl.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--ptl-bg); color: var(--ptl-text); min-height: 100vh; }
.loading { text-align: center; padding: 60px 20px; color: #CBD5E1; }
.loading-spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #22C55E; border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tienda-banner { position: relative; height: 160px; background: linear-gradient(135deg, #0A0E1A 0%, #131A2E 100%); overflow: hidden; border-bottom: 1px solid var(--ptl-border); }
.tienda-banner img { width: 100%; height: 100%; object-fit: cover; }
.tienda-header { max-width: 900px; margin: 0 auto; padding: 0 16px; position: relative; margin-top: -50px; }
.tienda-logo { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--ptl-card); background: var(--ptl-green); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: #0A0E1A; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
.tienda-logo img { width: 100%; height: 100%; object-fit: cover; }
.tienda-info { padding: 12px 0; }
.tienda-name {
  font-size: 30px;
  font-weight: 900;
  color: #0A0E1A;
  text-shadow: 0 2px 12px rgba(0,0,0,0.6), 0 1px 3px rgba(0,0,0,0.4);
  margin-bottom: 8px;
  line-height: 1.15;
  letter-spacing: -0.5px;
}
.tienda-desc { font-size: 15px; color: #CBD5E1; line-height: 1.5; margin-bottom: 12px; }
.tienda-stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.tienda-stat { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ptl-text-muted); font-weight: 600; }
.tienda-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.btn-share { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--ptl-card); color: var(--ptl-text); border: 1px solid var(--ptl-border); border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; }
.btn-share:hover { background: var(--ptl-card-hover); }
.btn-wa { background: var(--ptl-green); color: #0A0E1A; border: none; }
.btn-wa:hover { box-shadow: 0 4px 12px rgba(37,211,102,.3); }
.container { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }
.filters { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 20px; display: flex; gap: 8px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
.filter-btn { padding: 8px 14px; background: #f1f5f9; color: #CBD5E1; border: none; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all .15s; }
.filter-btn.active { background: #22C55E; color: #0A0E1A; }
.filter-btn:hover { background: #dbeafe; }
.filter-btn.active:hover { background: #001a35; }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.product-card { background: var(--ptl-card); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.3); transition: transform .15s, box-shadow .15s; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; border: 1px solid var(--ptl-border); }
.product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.4); }
.product-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--ptl-bg); }
.product-info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
.product-title { font-size: 13px; font-weight: 700; line-height: 1.3; margin-bottom: 6px; color: var(--ptl-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-price { font-size: 16px; font-weight: 900; color: var(--ptl-green); margin-top: auto; }
.product-location { font-size: 11px; color: var(--ptl-text-dim); margin-top: 4px; }
.empty { text-align: center; padding: 60px 20px; color: #CBD5E1; }
.error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 20px; text-align: center; margin: 40px auto; max-width: 500px; }
.error-box h2 { color: #dc2626; margin-bottom: 8px; font-size: 18px; }
.error-box p { color: #991b1b; font-size: 14px; margin-bottom: 16px; }
.btn-back { display: inline-block; padding: 10px 20px; background: #22C55E; color: #0A0E1A; text-decoration: none; border-radius: 8px; font-weight: 600; }
.footer { text-align: center; padding: 40px 20px 20px; color: #94a3b8; font-size: 12px; }
.footer a { color: #22C55E; text-decoration: none; font-weight: 600; }
@media (max-width: 480px) {
  .tienda-logo { width: 80px; height: 80px; font-size: 32px; margin-top: -40px; }
  .tienda-name { font-size: 22px; }
  .products-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
}
</style>

<style id="ptl-tienda-visual-fix">
  /* 1. Fondo general oscuro para toda la tienda */
  body, html { 
      background-color: #0A0E1A !important; 
      color: #F1F5F9 !important; 
  }

  /* 2. Eliminar fondos blancos de los contenedores */
  .tienda-header, .tienda-info, .main-container, .container, .store-details {
      background-color: transparent !important;
      background: transparent !important;
  }

  /* 3. Nombre de la tienda y descripción */
  h1, h2, h3, .tienda-nombre, .store-name { 
      color: #F1F5F9 !important; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.5) !important;
  }
  p, .tienda-descripcion, .store-description, .descripcion { 
      color: #94A3B8 !important; 
  }

  /* 4. Estadísticas (11 productos, 1 provincia, 5 categorías) */
  .tienda-stats, .store-stats, .stats-bar, .stats span, .tienda-stats span {
      color: #F1F5F9 !important;
      background: #131A2E !important;
      padding: 4px 10px !important;
      border-radius: 12px !important;
      border: 1px solid #1F2A44 !important;
  }

  /* 5. Botones de la tienda (Compartir, Contactar) */
  .btn-compartir, .btn-contactar { 
      color: #FFF !important; 
      font-weight: 800 !important;
  }

  /* 6. Pestañas de categorías (Todo, Pianos...) */
  .categorias-tabs, .tabs-container, .tabs { 
      background: #131A2E !important; 
      border-radius: 12px !important;
      padding: 8px !important;
      border: 1px solid #1F2A44 !important;
  }
  .categoria-btn, .tab-btn, .tabs button, .tabs a {
      color: #94A3B8 !important;
      background: transparent !important;
      font-weight: bold !important;
  }
  .categoria-btn.active, .tab-btn.active, .tabs button.active, .tabs a.active {
      background: #22C55E !important;
      color: #0A0E1A !important;
      border-radius: 8px !important;
  }

  /* 7. Barra de búsqueda */
  input[type="text"], input[type="search"], .search-input {
      background-color: #131A2E !important;
      color: #F1F5F9 !important;
      border: 1px solid #1F2A44 !important;
  }
  input::placeholder { color: #64748B !important; }

  /* 8. Arreglar la superposición del logo de ProfitToLife */
  .brand-logo, .ptl-logo-container { 
      position: relative !important; 
      z-index: 1 !important; 
      margin-top: -10px !important; 
  }

  /* 9. Si el banner superior está roto, darle un color de fondo */
  .banner-container, .tienda-banner {
      background-color: #004d65 !important; /* Color base de MTM */
      min-height: 120px !important;
  }
</style>

</head>
<body>

<div id="content">
  <div class="loading">
    <div class="loading-spinner"></div>
    <p>Cargando tienda...</p>
  </div>
</div>

<footer class="footer">
  <p>ProfitToLife Marketplace · Compra cubano, compra cerca 🇨🇺</p>
  <p style="margin-top:8px"><a href="shop.html">← Ver toda la tienda</a></p>
</footer>

<script>
const API = 'https://com-diaz-ty2b.onrender.com';
const params = new URLSearchParams(location.search);
const slug = params.get('slug');
const content = document.getElementById('content');

let tienda = null;
let productos = [];
let categoriaActiva = 'todas';

function esc(s) { return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function fmtPrice(n) { return Number(n || 0).toFixed(2); }
function imgUrl(url) {
  if (!url) return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23f3f4f6" width="100" height="100"/><text x="50" y="55" font-family="sans-serif" font-size="12" fill="%239ca3af" text-anchor="middle">Sin imagen</text></svg>';
  return url;
}

function showError(msg, code) {
  content.innerHTML = `
    <div class="error-box">
      <h2>❌ ${code || 'Error'}</h2>
      <p>${esc(msg)}</p>
      <a href="shop.html" class="btn-back">← Volver a la tienda</a>
    </div>
  `;
}

async function cargarTienda() {
  if (!slug) {
    showError('Falta el slug de la tienda en la URL', 'Tienda no especificada');
    return;
  }
  
  try {
    const r = await fetch(API + '/api/public/tienda/' + encodeURIComponent(slug));
    const d = await r.json();
    
    if (!d.ok) {
      showError(d.error || 'Tienda no encontrada', 'No disponible');
      return;
    }
    
    tienda = d.tienda;
    productos = d.productos || [];
    renderTienda(d.stats);
    cargarReputacion(tienda.seller_id);
    // 📊 Registrar visita
    fetch(API + '/api/public/tienda/' + encodeURIComponent(slug) + '/visita', { method: 'POST' }).catch(function(){});
  } catch(e) {
    showError('Error de conexión. Verifica tu internet.', 'Error de red');
  }
}

function renderTienda(stats) {
  document.title = tienda.nombre + ' — ProfitToLife Marketplace';
  document.body.style.background = '#f8fafc';
  
  const color = tienda.color || '#22C55E';
  const logoHTML = tienda.logo 
    ? `<img src="${esc(tienda.logo)}" alt="${esc(tienda.nombre)}">` 
    : esc(tienda.nombre.charAt(0).toUpperCase());
  
  const waUrl = tienda.whatsapp 
    ? 'https://wa.me/' + tienda.whatsapp.replace(/\D/g, '') + '?text=' + encodeURIComponent('Hola! Vengo de ProfitToLife y quiero ver tus productos 🛍️')
    : null;
  
  // Categorías únicas de los productos
  const categorias = ['todas', ...new Set(productos.map(p => p.categoria).filter(Boolean))];
  
  let filtrosHTML = '';
  if (categorias.length > 1) {
    filtrosHTML = '<div class="filters">' + categorias.map(c => 
      `<button class="filter-btn ${c === 'todas' ? 'active' : ''}" data-cat="${esc(c)}">${c === 'todas' ? '📦 Todo' : '📁 ' + esc(c)}</button>`
    ).join('') + '</div>';
  }
  
  const shopUrl = location.origin + location.pathname + '?slug=' + encodeURIComponent(slug);
  const shareMsg = `Mira la tienda *${tienda.nombre}* en ProfitToLife Marketplace:\n\n${shopUrl}\n\n🛍️ Compra directo por WhatsApp`;
  
  content.innerHTML = `
    <div class="tienda-banner" style="background:linear-gradient(135deg, ${color} 0%, ${color}dd 100%)">
      ${tienda.banner ? `<img src="${esc(tienda.banner)}" alt="">` : ''}
    </div>
    <div class="tienda-header">
      <div class="tienda-logo" style="background:${color}">${logoHTML}</div>
      <div class="tienda-info">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--ptl-border)">
          <div class="ptl-logo ptl-logo-sm"><svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block"><rect width="100" height="100" rx="22" fill="#0B132B"/><path d="M 32 26 L 55 26 C 72 26 80 38 80 50 C 80 62 72 74 55 74 L 48 74 L 48 82 L 32 82 Z M 48 38 L 48 62 L 54 62 C 62 62 66 56 66 50 C 66 44 62 38 54 38 Z" fill="#FFFFFF"/></svg></div>
          <div>
            <div class="ptl-brand-name">ProfitToLife</div>
            <div class="ptl-brand-tagline">
              <span class="ganancia">Ganancia</span>
              <span class="para"> para </span>
              <span class="vida">la vida</span>
            </div>
          </div>
          <span class="ptl-badge ptl-badge-green" style="margin-left:auto;font-size:10px">Marketplace</span>
        </div>
        <h1 class="tienda-name">
          ${esc(tienda.nombre)} 
          ${tienda.esVerificado ? '<span style="background:#22C55E; color:#0A0E1A; font-size:12px; padding:4px 8px; border-radius:999px; font-weight:800; margin-left:8px; vertical-align:middle; display:inline-flex; align-items:center; gap:4px; box-shadow:0 2px 8px rgba(34,197,94,0.4);">✅ Verificado</span>' : ''}
        </h1>
        <div id="reputacionVendedor" style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <!-- Se llena con JS -->
        </div>
        ${tienda.descripcion ? `<p class="tienda-desc">${esc(tienda.descripcion)}</p>` : ''}
        <div class="tienda-stats">
          <span class="tienda-stat">📦 ${stats.totalProductos} producto${stats.totalProductos !== 1 ? 's' : ''}</span>
          ${stats.provincias.length > 0 ? `<span class="tienda-stat">📍 ${stats.provincias.length} provincia${stats.provincias.length !== 1 ? 's' : ''}</span>` : ''}
          ${stats.categorias.length > 0 ? `<span class="tienda-stat">📁 ${stats.categorias.length} categoría${stats.categorias.length !== 1 ? 's' : ''}</span>` : ''}
        </div>
        <div class="tienda-actions">
          <button class="btn-share" onclick="compartirTienda()">
            🔗 Compartir tienda
          </button>
          ${waUrl ? `<a href="${waUrl}" class="btn-share btn-wa" target="_blank">📲 Contactar</a>` : ''}
        </div>
      </div>
    </div>
    <div class="container">
      ${filtrosHTML}
      
    <div style="margin-bottom: 16px;">
      <input type="text" id="buscadorTienda" placeholder="🔍 Buscar en esta tienda..." 
             style="width:100%; padding:12px; border-radius:10px; border:1px solid #1F2A44; background:#131A2E; color:#F1F5F9; font-size:14px;"
             oninput="filtrarTienda(this.value)">
    </div>
    <div class="products-grid" id="productsGrid"></div>
    </div>
  `;
  
  renderProductos();
  
  // Listeners de filtros
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      categoriaActiva = btn.dataset.cat;
      renderProductos();
    });
  });
  
  // Función compartir
  window.compartirTienda = async function() {
    if (navigator.share) {
      try {
        await navigator.share({
          title: tienda.nombre,
          text: `Mira la tienda ${tienda.nombre} en ProfitToLife Marketplace`,
          url: shopUrl
        });
        return;
      } catch(e) {
        if (e.name === 'AbortError') return;
      }
    }
    try {
      await navigator.clipboard.writeText(shareMsg);
      alert('✅ Link copiado. Pégalo en WhatsApp o donde quieras.');
    } catch(e) {
      prompt('Copia este link:', shopUrl);
    }
  };
}

function renderProductos() {
  const grid = document.getElementById('productsGrid');
  if (!grid) return;
  
  let filtrados = productos;
  if (categoriaActiva !== 'todas') {
    filtrados = productos.filter(p => p.categoria === categoriaActiva);
  }
  
  if (filtrados.length === 0) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Esta tienda no tiene productos en esta categoría.</div>';
    return;
  }
  
  grid.innerHTML = filtrados.map(p => {
    const img = imgUrl(p.imagenes && p.imagenes[0]);
    return `
      <a href="producto.html?id=${esc(p.id)}" class="product-card">
        <img class="product-img" src="${esc(img)}" alt="${esc(p.titulo)}" loading="lazy" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23f3f4f6%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 font-family=%22sans-serif%22 font-size=%2214%22 fill=%22%239ca3af%22 text-anchor=%22middle%22>Sin imagen</text></svg>'">
        <div class="product-info">
          <div class="product-title">${esc(p.titulo)}</div>
          <div class="product-price">$${fmtPrice(p.precio_usd)}</div>
          ${p.provincia ? `<div class="product-location">📍 ${esc(p.provincia)}${p.municipio ? ' / ' + esc(p.municipio) : ''}</div>` : ''}
        </div>
      </a>
    `;
  }).join('');
}

cargarTienda();

  // ═══ CARGAR REPUTACIÓN DEL VENDEDOR ═══
  async function cargarReputacion(vendedorId) {
    try {
      const res = await fetch(API + '/api/resenas/' + vendedorId);
      const data = await res.json();
      
      const container = document.getElementById('reputacionVendedor');
      if (!container) return;

      if (data.ok && data.resenas && data.resenas.length > 0) {
        const total = data.resenas.length;
        const suma = data.resenas.reduce((acc, r) => acc + r.calificacion, 0);
        const promedio = (suma / total).toFixed(1);
        
        const llenas = Math.round(promedio);
        const estrellas = '★'.repeat(llenas) + '☆'.repeat(5 - llenas);

        container.innerHTML = `
          <span style="color: #FCD34D; font-size: 18px; letter-spacing: 2px;">${estrellas}</span>
          <span style="color: #F1F5F9; font-size: 16px; font-weight: 800;">${promedio}</span>
          <span style="color: #CBD5E1; font-size: 12px;">(${total} ${total === 1 ? 'reseña' : 'reseñas'})</span>
        `;
      } else {
        container.innerHTML = `
          <span style="color: #CBD5E1; font-size: 13px;">⭐ Vendedor nuevo · Aún sin reseñas</span>
        `;
      }
    } catch(e) {
      console.log('Error cargando reputación:', e);
    }
  }

</script>
<script src="tienda-carrito.js"></script>
</body>
</html>
