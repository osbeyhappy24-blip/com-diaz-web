<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando producto — Comdiaz Shop</title>
<meta name="theme-color" content="#003f7f">
<link rel="icon" type="image/png" href="favicon-shop.png">
<link rel="stylesheet" href="style.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
.header { background: linear-gradient(135deg, #003f7f 0%, #001a35 100%); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.header-back { color: #fff; text-decoration: none; font-size: 22px; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.1); }
.header-title { font-size: 16px; font-weight: 700; flex: 1; }
.container { max-width: 600px; margin: 0 auto; padding: 16px; }
.loading { text-align: center; padding: 60px 20px; color: #64748b; }
.loading-spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #003f7f; border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 20px; text-align: center; margin: 40px 0; }
.error-box h2 { color: #dc2626; margin-bottom: 8px; font-size: 18px; }
.error-box p { color: #991b1b; font-size: 14px; margin-bottom: 16px; }
.btn-back { display: inline-block; padding: 10px 20px; background: #003f7f; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
.product-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
.image-container { position: relative; width: 100%; background: #f1f5f9; aspect-ratio: 1; overflow: hidden; }
.image-container img { width: 100%; height: 100%; object-fit: contain; transition: transform .3s; }
.image-container:hover img { transform: scale(1.02); }
.image-badge { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.7); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.image-nav { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(0,0,0,.5); padding: 6px 12px; border-radius: 20px; }
.image-nav span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.4); transition: background .2s; cursor: pointer; }
.image-nav span.active { background: #fbbf24; }
.product-body { padding: 20px; }
.tienda-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: #eff6ff; color: #003f7f; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px; text-decoration: none; }
.tienda-badge:hover { background: #dbeafe; }
.tienda-badge.anonimo { background: #f3f4f6; color: #6b7280; cursor: default; }
.product-title { font-size: 22px; font-weight: 800; line-height: 1.3; margin-bottom: 12px; color: #0f172a; }
.product-price { font-size: 28px; font-weight: 900; color: #003f7f; margin-bottom: 4px; }
.product-price-cup { font-size: 14px; color: #64748b; margin-bottom: 16px; }
.product-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.meta-chip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; background: #f1f5f9; border-radius: 8px; font-size: 12px; color: #475569; font-weight: 600; }
.product-desc { font-size: 14px; color: #475569; line-height: 1.6; padding: 16px 0; border-top: 1px solid #e2e8f0; margin-top: 8px; }
.product-desc.empty { color: #94a3b8; font-style: italic; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; text-decoration: none; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform .15s, box-shadow .15s; box-shadow: 0 4px 12px rgba(37,211,102,.3); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,211,102,.4); }
.btn-secondary { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; background: #fff; color: #003f7f; border: 2px solid #003f7f; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; transition: background .15s; }
.btn-secondary:hover { background: #eff6ff; }
.footer { text-align: center; padding: 40px 20px 20px; color: #94a3b8; font-size: 12px; }
.footer a { color: #003f7f; text-decoration: none; font-weight: 600; }
@media (max-width: 480px) {
  .product-title { font-size: 20px; }
  .product-price { font-size: 24px; }
  .container { padding: 12px; }
  .product-body { padding: 16px; }
}
</style>
</head>
<body>

<header class="header">
  <a href="shop.html" class="header-back">←</a>
  <div class="header-title" id="headerTitle">Producto</div>
</header>

<main class="container">
  <div id="content">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>Cargando producto...</p>
    </div>
  </div>
</main>

<footer class="footer">
  <p>Comdiaz Shop · Compra cubano, compra cerca 🇨🇺</p>
  <p style="margin-top:8px"><a href="shop.html">← Volver a la tienda</a></p>
</footer>

<script>
const API = 'https://com-diaz-ty2b.onrender.com';
const params = new URLSearchParams(location.search);
const productId = params.get('id');

const content = document.getElementById('content');
const headerTitle = document.getElementById('headerTitle');

function esc(s) { return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function fmtPrice(n) { return Number(n || 0).toFixed(2); }

function showError(msg, code) {
  content.innerHTML = `
    <div class="error-box">
      <h2>❌ ${code || 'Error'}</h2>
      <p>${esc(msg)}</p>
      <a href="shop.html" class="btn-back">← Volver a la tienda</a>
    </div>
  `;
}

async function cargarProducto() {
  if (!productId) {
    showError('Falta el ID del producto en la URL', 'Producto no especificado');
    return;
  }
  
  try {
    const r = await fetch(API + '/api/public/producto/' + encodeURIComponent(productId));
    const d = await r.json();
    
    if (!d.ok) {
      showError(d.error || 'Producto no encontrado', 'No disponible');
      return;
    }
    
    renderProducto(d.producto);
  } catch(e) {
    showError('Error de conexión. Verifica tu internet.', 'Error de red');
  }
}

function renderProducto(p) {
  document.title = p.titulo + ' — Comdiaz Shop';
  headerTitle.textContent = p.titulo;
  
  const imagenes = (p.imagenes && p.imagenes.length > 0) ? p.imagenes : [];
  const imgPrincipal = imagenes[0] || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23f3f4f6" width="100" height="100"/><text x="50" y="55" font-family="sans-serif" font-size="12" fill="%239ca3af" text-anchor="middle">Sin imagen</text></svg>';
  
  // WhatsApp URL con mensaje
  const telefono = '5351425691';
  const mensaje = encodeURIComponent(`Hola! Me interesa este producto de Comdiaz:\n\n*${p.titulo}*\nPrecio: $${fmtPrice(p.precio_usd)}\n\n¿Está disponible?`);
  const waUrl = 'https://wa.me/' + telefono + '?text=' + mensaje;
  
  // Badge de tienda o anónimo
  let tiendaHtml = '';
  if (p.tienda_slug && p.tienda_nombre) {
    tiendaHtml = `<a href="tienda.html?slug=${esc(p.tienda_slug)}" class="tienda-badge">🏪 ${esc(p.tienda_nombre)}</a>`;
  } else if (p.seller_nombre) {
    tiendaHtml = `<span class="tienda-badge anonimo">🏷️ ${esc(p.seller_nombre)}</span>`;
  }
  
  // Navegador de imágenes
  let navHtml = '';
  if (imagenes.length > 1) {
    navHtml = '<div class="image-nav">' + imagenes.map((_, i) => `<span class="${i===0?'active':''}" data-idx="${i}"></span>`).join('') + '</div>';
  }
  
  // Meta chips
  const metaChips = [];
  if (p.estado_producto) metaChips.push(`<span class="meta-chip">✨ ${esc(p.estado_producto)}</span>`);
  if (p.stock > 0) metaChips.push(`<span class="meta-chip">📦 Stock: ${p.stock}</span>`);
  if (p.categoria) metaChips.push(`<span class="meta-chip">📁 ${esc(p.categoria)}</span>`);
  if (p.provincia) metaChips.push(`<span class="meta-chip">📍 ${esc(p.provincia)}${p.municipio ? ' / ' + esc(p.municipio) : ''}</span>`);
  
  const descripcion = p.descripcion && p.descripcion.trim() ? esc(p.descripcion) : 'Sin descripción disponible';
  
  let botonTienda = '';
  if (p.tienda_slug && p.tienda_nombre) {
    botonTienda = `<a href="tienda.html?slug=${esc(p.tienda_slug)}" class="btn-secondary">🏪 Ver tienda completa</a>`;
  }
  
  content.innerHTML = `
    <div class="product-card">
      <div class="image-container" id="imgContainer">
        <img id="imgMain" src="${esc(imgPrincipal)}" alt="${esc(p.titulo)}" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23f3f4f6%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 font-family=%22sans-serif%22 font-size=%2212%22 fill=%22%239ca3af%22 text-anchor=%22middle%22>Sin imagen</text></svg>'">
        ${imagenes.length > 0 ? `<span class="image-badge">${esc(p.estado_producto || 'nuevo')}</span>` : ''}
        ${navHtml}
      </div>
      <div class="product-body">
        ${tiendaHtml}
        <h1 class="product-title">${esc(p.titulo)}</h1>
        <div class="product-price">$${fmtPrice(p.precio_usd)} USD</div>
        ${p.precio_cup ? `<div class="product-price-cup">${Number(p.precio_cup).toLocaleString()} CUP</div>` : ''}
        <div class="product-meta">${metaChips.join('')}</div>
        <div class="product-desc ${!p.descripcion ? 'empty' : ''}">${descripcion}</div>
        <div class="actions">
          <a href="${waUrl}" class="btn-primary" target="_blank">
            📲 Pedir por WhatsApp
          </a>
          ${botonTienda}
        </div>
      </div>
    </div>
  `;
  
  // Navegador de imágenes
  if (imagenes.length > 1) {
    document.querySelectorAll('.image-nav span').forEach(span => {
      span.addEventListener('click', () => {
        const idx = Number(span.dataset.idx);
        document.getElementById('imgMain').src = imagenes[idx];
        document.querySelectorAll('.image-nav span').forEach(s => s.classList.remove('active'));
        span.classList.add('active');
      });
    });
  }
}

cargarProducto();
</script>
</body>
</html>
